[package]
name = "mkds_launcher"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "MKDSrust"
path = "src/main.rs"

[dependencies]
mkds_builder = { path = "../1_build_tool" }
eframe = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
