[package]
name = "recomp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Spike: lift ARM machine code from a user-supplied MKDS ROM to Rust (no game logic is stored here)"
build = "build.rs"

[[bin]]
name = "mkds_lift"
path = "src/bin/mkds_lift.rs"

[[bin]]
name = "mkds_gen"
path = "src/bin/mkds_gen.rs"
required-features = ["gen"]

[[test]]
name = "boot"
required-features = ["interpreter"]

[[test]]
name = "differential"
required-features = ["interpreter"]

[[test]]
name = "rt_irq"
required-features = ["interpreter"]

[[test]]
name = "synthetic_lift"
required-features = ["interpreter"]

[features]
# The reference interpreter (tests, differential checks, diagnostics). Shipped games build recomp with
# `default-features = false`: a pc with no lifted code is then an error naming the pc and segment.
default = ["interpreter"]
interpreter = []
gen = ["dep:mkds_builder", "dep:serde_json", "dep:sha2"]

[dependencies]
corosensei = "0.3.4"
mkds_builder = { path = "../1_build_tool", optional = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.11.0", optional = true }

[build-dependencies]
mkds_builder = { path = "../1_build_tool" }

[dev-dependencies]
mkds_builder = { path = "../1_build_tool" }
