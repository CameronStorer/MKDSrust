[package]
name = "mkds_native"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native window, audio and input host for locally generated MKDSrust code"

[dependencies]
recomp = { path = "..", default-features = false }
mkds_builder = { path = "../../1_build_tool" }
cpal = "=0.17.3"
serde_json = "1.0.151"
sha2 = "0.11.0"
wgpu = "=30.0.1"
png = "=0.18.1"
pollster = "=1.0.1"
winit = "=0.30.13"
gilrs = "=0.11.2"
bytemuck = { version = "=1.25.2", features = ["derive"] }

[features]
# The reference interpreter (diagnostics and `mkds_runtime_probe`). Generated games depend on mkds_native with
# `default-features = false`, so the interpreter is not compiled into the shipped game.
default = ["interpreter"]
interpreter = ["recomp/interpreter"]

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "mkds_runtime_probe"
path = "src/main.rs"
required-features = ["interpreter"]
