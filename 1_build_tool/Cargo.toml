[package]
name = "mkds_builder"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# Making bsdiff patches (mod packing). Its suffix sorting is C, so games (and the portable toolchain) build
# without it: applying patches is modpkg::bspatch (pure Rust).
qbsdiff = { version = "=1.4.4", optional = true }
bzip2 = "=0.6.1"
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }
semver = "=1.0.28"


tempfile = "3.27.0"

[features]
# Mod authoring (`--make-patch`, `mod pack`, launcher Create mod). Generated games use default-features = false.
default = ["diff"]
diff = ["dep:qbsdiff"]
